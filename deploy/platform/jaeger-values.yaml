# Replaces the chart default config entirely: upstream all-in-one,
# trimmed to OTLP receivers and a smaller in-memory trace cap.
userconfig:
  service:
    extensions: [jaeger_storage, jaeger_query, healthcheckv2]
    pipelines:
      traces:
        receivers: [otlp]
        processors: [batch]
        exporters: [jaeger_storage_exporter]
    telemetry:
      resource:
        service.name: jaeger
      metrics:
        level: basic
        readers:
          - pull:
              exporter:
                prometheus:
                  host: 0.0.0.0
                  port: 8888
      logs:
        level: info

  extensions:
    healthcheckv2:
      use_v2: true
      http:
        endpoint: 0.0.0.0:13133
    jaeger_query:
      storage:
        traces: memstore
      http:
        endpoint: 0.0.0.0:16686
      grpc:
        endpoint: 0.0.0.0:16685
    jaeger_storage:
      backends:
        memstore:
          memory:
            max_traces: 20000

  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  processors:
    batch: {}

  exporters:
    jaeger_storage_exporter:
      trace_storage: memstore

jaeger:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - jaeger.localhost
    pathType: Prefix
