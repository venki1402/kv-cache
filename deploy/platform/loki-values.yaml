deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  limits_config:
    retention_period: 6h
    reject_old_samples: true
    reject_old_samples_max_age: 6h
    max_cache_freshness_per_query: 10m
    split_queries_by_interval: 15m
    query_timeout: 300s
    volume_enabled: true
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
    compaction_interval: 10m
    retention_delete_delay: 30m
  pattern_ingester:
    enabled: false
  analytics:
    reporting_enabled: false

singleBinary:
  replicas: 1
  affinity: {}
  persistence:
    enabled: true
    size: 2Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

write:
  replicas: 0
read:
  replicas: 0
backend:
  replicas: 0

gateway:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
memcached:
  enabled: false
memcachedExporter:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
ruler:
  enabled: false
sidecar:
  rules:
    enabled: false
minio:
  enabled: false
