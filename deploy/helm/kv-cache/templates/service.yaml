apiVersion: v1
kind: Service
metadata:
  name: {{ include "kv-cache.fullname" . }}
  labels:
    {{- include "kv-cache.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "kv-cache.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
    - name: metrics
      port: {{ .Values.service.metricsPort }}
      targetPort: metrics
