apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kv-cache.fullname" . }}
  labels:
    {{- include "kv-cache.labels" . | nindent 4 }}
spec:
  # Fixed at one: each replica would hold a different key set behind one
  # Service, so scaling out would give inconsistent reads.
  replicas: 1
  revisionHistoryLimit: 5
  progressDeadlineSeconds: {{ .Values.progressDeadlineSeconds }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # The old pod keeps serving until the new one is ready.
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "kv-cache.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kv-cache.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/commit: {{ .Values.image.tag | toString | trunc 63 | quote }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        kv-cache/image: {{ include "kv-cache.image" . | quote }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "kv-cache.fullname" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kv-cache
          image: {{ include "kv-cache.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
            - name: metrics
              containerPort: {{ .Values.service.metricsPort }}
          envFrom:
            - configMapRef:
                name: {{ include "kv-cache.fullname" . }}
          env:
            - name: MEMORY_LIMIT_BYTES
              valueFrom:
                resourceFieldRef:
                  containerName: kv-cache
                  resource: limits.memory
            {{- if .Values.auth.existingSecret }}
            - name: AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret }}
                  key: {{ .Values.auth.secretKey }}
            {{- end }}
          # No startup probe: the process is ready in milliseconds, so the
          # readiness probe alone gates traffic.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
          lifecycle:
            # Lets endpoint removal propagate to Traefik before SIGTERM.
            # Native sleep action because distroless has no shell.
            preStop:
              sleep:
                seconds: {{ .Values.preStopSleepSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
